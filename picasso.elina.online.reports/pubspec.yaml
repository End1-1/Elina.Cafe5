name: picasso_elina_online_worker
description: ""
publish_to: 'none'

version: 1.0.2+36

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  flutter_launcher_icons: ^0.14.1
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.2
  intl: any

  http: ^1.1.2
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  flutter_slidable: ^4.0.0
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon.png"